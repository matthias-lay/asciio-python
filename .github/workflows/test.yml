name: Python
on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy
      - run: pytest -q
  gtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y make python3-wcwidth python3-regex python3-pytest \
            python3-gi python3-gi-cairo python3-cairo \
            gir1.2-gtk-3.0 gir1.2-pango-1.0 xvfb xauth
          make install PREFIX=/tmp/pasciio
      - run: xvfb-run -a /usr/bin/python3 -m pytest -q
        env:
          PYTHONPATH: src
          PASCIIO_GUI_TESTS: "1"
          PASCIIO_BIN_DIR: /tmp/pasciio/bin
  distro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            family: debian
            python: /usr/bin/python3
          - image: debian:13
            family: debian
            python: /usr/bin/python3
          - image: fedora:latest
            family: fedora
            python: /usr/bin/python3
          - image: archlinux:base
            family: arch
            python: /usr/bin/python3
          - image: opensuse/leap:16.0
            family: opensuse
            python: /usr/bin/python3.13
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Install only distro packages
        run: |
          case "${{ matrix.family }}" in
            debian)
              apt-get update -qq
              apt-get install -y --no-install-recommends make python3 \
                python3-wcwidth python3-regex python3-pytest
              ;;
            fedora)
              dnf install -y make python3 python3-wcwidth python3-regex python3-pytest
              ;;
            arch)
              pacman -Syu --noconfirm --needed make python python-wcwidth python-regex python-pytest
              ;;
            opensuse)
              zypper --non-interactive install make python313 python313-curses \
                python313-wcwidth python313-regex python313-pytest
              ;;
          esac
      - run: make install PREFIX=/tmp/pasciio PYTHON=${{ matrix.python }}
      - run: ${{ matrix.python }} -m pytest -q
        env:
          PYTHONPATH: src
          PASCIIO_BIN_DIR: /tmp/pasciio/bin
