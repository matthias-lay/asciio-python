[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asciio-python"
version = "0.1.0"
description = "An ASCII and Unicode diagram editor with GTK and terminal interfaces"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
dependencies = ["wcwidth>=0.9.5"]

[project.optional-dependencies]
gui = ["PyGObject>=3.42", "pycairo>=1.20"]
dev = ["ruff>=0.9", "pytest>=8", "mypy>=1.13"]

[project.scripts]
asciio = "asciio.cli:gui_main"
tasciio = "asciio.cli:tui_main"
asciio-to-text = "asciio.cli:to_text_main"
asciio_to_text = "asciio.cli:to_text_main"
text-to-asciio = "asciio.cli:from_text_main"
text_to_asciio = "asciio.cli:from_text_main"
asciio-python = "asciio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
files = ["src/asciio"]

[[tool.mypy.overrides]]
module = ["gi", "gi.*", "cairo"]
ignore_missing_imports = true
